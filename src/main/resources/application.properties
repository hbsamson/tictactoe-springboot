spring.application.name=tictactoe-springboot
spring.cassandra.contact-points=${CASSANDRA_CONTACT_POINTS:localhost:9042}
spring.cassandra.local-datacenter=${CASSANDRA_LOCAL_DATACENTER:datacenter1}
spring.cassandra.keyspace-name=${CASSANDRA_KEYSPACE:tictactoe_springboot}
spring.cassandra.schema-action=${CASSANDRA_SCHEMA_ACTION:CREATE_IF_NOT_EXISTS}
spring.cassandra.request.timeout=${CASSANDRA_REQUEST_TIMEOUT:10s}
app.cors.allowed-origins=${FRONTEND_URLS:http://localhost:5500,http://127.0.0.1:5500}
